root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  entrypoint = ["./tmp/main"]
  delay = 1000
  exclude_dir = ["tmp", "data", "bin", "node_modules"]
  include_ext = ["go", "html", "css"]
  stop_on_error = true
  # SIGINT o tmp/main antigo e espera antes do SIGKILL, senão o zumbi segura
  # :8080 e o sqlite WAL e o próximo boot troca de porta / trava (#77).
  send_interrupt = true
  kill_delay = 1000

[log]
  time = false
  main_only = true

[misc]
  clean_on_exit = true
  startup_banner = ""
